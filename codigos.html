<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Challenge — Códigos</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3242;
    --txt:#e6edf3; --muted:#8b98a9; --accent:#e11d2a;
    --green:#26c281; --amber:#f5a623; --gold:#f7c948; --red:#e5484d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(900px 500px at 50% -10%,#1a2330 0%,var(--bg) 60%);
    color:var(--txt); min-height:100vh; padding:18px 14px 40px;
  }
  .top{max-width:760px; margin:0 auto 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .oplogo{height:52px; width:auto; filter:drop-shadow(0 4px 14px rgba(0,0,0,.55))}
  .top h1{font-size:17px; letter-spacing:.5px}
  .top .sub{color:var(--muted); font-size:12px; font-weight:600}
  .spacer{flex:1}
  .mini{background:var(--panel2); border:1px solid var(--line); color:var(--txt); padding:9px 14px; border-radius:10px; font-weight:700; cursor:pointer; font-size:13px}
  .mini:hover{border-color:var(--accent)}

  .wrap{max-width:760px; margin:0 auto}
  .search{
    width:100%; background:var(--panel2); border:1.5px solid var(--line); color:var(--txt);
    padding:15px 18px; border-radius:14px; font-size:17px; font-weight:600; outline:none; margin-bottom:12px;
  }
  .search:focus{border-color:var(--accent)}
  .tabs{display:flex; gap:8px; margin-bottom:14px}
  .tab{
    flex:1; text-align:center; padding:11px; border-radius:12px; font-weight:800; font-size:14px;
    background:var(--panel2); border:1px solid var(--line); color:var(--muted); cursor:pointer;
  }
  .tab.on{background:var(--accent); border-color:var(--accent); color:#fff}

  .row{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:12px 16px; margin-bottom:8px; display:flex; align-items:center; gap:14px;
  }
  .row.jogou{opacity:.45}
  .code{
    font-size:26px; font-weight:900; letter-spacing:3px; color:var(--gold);
    font-variant-numeric:tabular-nums; min-width:104px;
  }
  .who{flex:1; min-width:0}
  .who b{font-size:16px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .who span{color:var(--muted); font-size:12px; font-weight:600}
  .st{font-size:11px; font-weight:800; letter-spacing:.5px; padding:4px 10px; border-radius:999px; white-space:nowrap}
  .st.wait{background:#3a2f00; color:var(--amber)}
  .st.done{background:#0f3325; color:var(--green)}
  .empty{color:var(--muted); text-align:center; padding:50px 20px; font-size:15px}
  .updated{color:#4a5361; font-size:11px; text-align:center; margin-top:14px}

  /* PIN */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.85); display:flex; align-items:center; justify-content:center; z-index:90; padding:20px}
  .overlay.hide{display:none}
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; width:100%; max-width:340px; text-align:center}
  .modal h3{margin-bottom:14px; font-size:17px}
  .modal input{width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--txt); padding:14px; border-radius:12px; font-size:22px; font-weight:800; outline:none; text-align:center; margin-bottom:12px; letter-spacing:6px}
  .modal button{width:100%; border:0; border-radius:12px; padding:14px; font-weight:800; font-size:16px; color:#fff; background:linear-gradient(180deg,var(--green),#1fa06a); cursor:pointer}
  .modal .err{color:var(--red); font-weight:700; font-size:13px; min-height:18px; margin-top:8px}
</style>
</head>
<body>

<div class="overlay" id="pinOv">
  <div class="modal">
    <h3>🔒 Códigos dos participantes</h3>
    <input type="text" inputmode="numeric" id="pinIn" placeholder="PIN" maxlength="8" autocomplete="off">
    <button id="pinBtn">Entrar</button>
    <div class="err" id="pinErr"></div>
  </div>
</div>

<div class="top">
  <img class="oplogo" src="assets/ouro-preto-branco.png" alt="Ouro Preto Investimentos">
  <div><h1>Códigos dos participantes</h1><div class="sub">em ordem de cadastro · atualiza sozinho</div></div>
  <span class="spacer"></span>
  <button class="mini" id="refreshBtn">↻ Atualizar</button>
</div>

<div class="wrap">
  <input class="search" id="q" placeholder="🔍 Buscar por nome ou código…" autocomplete="off">
  <div class="tabs">
    <div class="tab on" id="tabWait">⏳ Aguardando jogar</div>
    <div class="tab" id="tabAll">Todos</div>
  </div>
  <div id="list"><div class="empty">Carregando…</div></div>
  <div class="updated" id="updated"></div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
let data=[], showAll=false, timer=null;

/* ===== PIN (mesmo do telão se for a mesma máquina; padrão 1234) ===== */
function pinOk(v){
  let pin="1234";
  try{ pin=String((JSON.parse(localStorage.getItem("golf_cfg"))||{}).pin||"1234"); }catch(e){}
  return v===pin;
}
if(sessionStorage.getItem("cod_ok")==="1") $("#pinOv").classList.add("hide");
$("#pinBtn").onclick=()=>{
  if(pinOk($("#pinIn").value.trim())){
    sessionStorage.setItem("cod_ok","1");
    $("#pinOv").classList.add("hide");
    load();
  }else{ $("#pinErr").textContent="PIN incorreto"; $("#pinIn").value=""; $("#pinIn").focus(); }
};
$("#pinIn").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#pinBtn").click(); });
setTimeout(()=>$("#pinIn").focus(),100);

/* ===== dados ===== */
async function load(){
  if(!$("#pinOv").classList.contains("hide")) return;
  try{
    const r=await fetch("/api/codigos",{cache:"no-store"});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||"erro");
    data=j.list||[];
    render();
    $("#updated").textContent="Atualizado às "+new Date().toLocaleTimeString("pt-BR");
  }catch(e){
    $("#updated").textContent="⚠ Sem conexão com o servidor — tentando de novo…";
  }
}
function hora(iso){
  try{ return new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; }
}
function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function render(){
  const q=$("#q").value.trim().toLowerCase();
  let rows=data;
  if(!showAll) rows=rows.filter(r=>!r.jogou);
  if(q) rows=rows.filter(r=>(r.nome||"").toLowerCase().includes(q)||(r.code||"").toLowerCase().includes(q));
  const wait=data.filter(r=>!r.jogou).length;
  $("#tabWait").textContent="⏳ Aguardando jogar ("+wait+")";
  $("#tabAll").textContent="Todos ("+data.length+")";
  if(!rows.length){
    $("#list").innerHTML='<div class="empty">'+(q?"Nenhum resultado pra essa busca.":"Nenhum cadastro aguardando — todo mundo já jogou! 🎉")+'</div>';
    return;
  }
  $("#list").innerHTML=rows.map(r=>
    '<div class="row'+(r.jogou?' jogou':'')+'">'
    +'<div class="code">'+esc(r.code)+'</div>'
    +'<div class="who"><b>'+esc(r.nome)+'</b><span>'+hora(r.criado)+(r.whatsapp?' · '+esc(r.whatsapp):'')+'</span></div>'
    +'<span class="st '+(r.jogou?'done">✔ jogou':'wait">aguardando')+'</span>'
    +'</div>'
  ).join("");
}

$("#q").addEventListener("input",render);
$("#tabWait").onclick=()=>{ showAll=false; $("#tabWait").classList.add("on"); $("#tabAll").classList.remove("on"); render(); };
$("#tabAll").onclick=()=>{ showAll=true; $("#tabAll").classList.add("on"); $("#tabWait").classList.remove("on"); render(); };
$("#refreshBtn").onclick=load;

load();
timer=setInterval(load,10000);

let wakeLock=null;
async function keepAwake(){
  try{
    if(!wakeLock && "wakeLock" in navigator){
      wakeLock=await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release",()=>{ wakeLock=null; });
    }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") keepAwake(); });
document.addEventListener("click",keepAwake,{once:true});
keepAwake();
</script>
</body>
</html>
