<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Challenge — Monitor da Câmera</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#2a3242; --txt:#e6edf3; --muted:#8b98a9;
    --accent:#e11d2a; --green:#26c281; --amber:#f5a623; --gold:#f7c948; --red:#e5484d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#000;color:var(--txt);height:100vh;overflow:hidden;display:flex;flex-direction:column}

  header{
    display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(13,17,23,.92);
    border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px;white-space:nowrap}
  .dot{width:24px;height:24px;border-radius:50%;
    background:conic-gradient(from 45deg,#fff 0 25%,var(--accent) 0 50%,#fff 0 75%,var(--accent) 0);
    box-shadow:0 0 0 2px #0d1117,0 0 0 4px var(--accent)}
  .spacer{flex:1}
  .st{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
  .st.ok{color:var(--green)} .st.hot{color:var(--gold)}
  .meterwrap{position:relative;height:14px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden;width:160px}
  .meter{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--amber),var(--red))}
  .thmark{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;opacity:.8}
  .mini{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:7px 12px;border-radius:9px;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap}
  .mini:hover{border-color:var(--accent)}
  .mini.on{background:#1fa06a;border-color:var(--green)}
  .mini.red{background:var(--red)}
  input[type=range]{accent-color:var(--accent);width:120px}
  label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}

  #stage{flex:1;position:relative;background:#000}
  #cam{width:100%;height:100%;object-fit:contain;display:block}
  #ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
  #ov.selecting{pointer-events:auto;cursor:crosshair}
  #msg{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:16px;text-align:center;padding:30px;
  }
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(120px);
    background:var(--panel);border:1px solid var(--line);padding:12px 18px;border-radius:12px;
    font-weight:700;z-index:60;transition:transform .3s;font-size:13px}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:var(--green)} .toast.err{border-color:var(--red)}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="assets/ouro-preto-branco.png" alt="Ouro Preto Investimentos" style="height:30px;width:auto"> MONITOR DA CÂMERA</div>
  <button class="mini" id="roiBtn">🟢 Definir buraco</button>
  <button class="mini red" id="roiClear" style="display:none">🗑 Remover</button>
  <label>Sensib.</label><input type="range" id="sensRange" min="1" max="10" step="1" value="5">
  <span class="spacer"></span>
  <span class="st">SINAL</span>
  <div class="meterwrap"><div class="meter" id="meter"></div><div class="thmark"></div></div>
  <span class="st" id="detSt">—</span>
  <button class="mini" id="refBtn">↺ Recalibrar</button>
  <button class="mini" id="fsBtn">⛶ Tela cheia (F)</button>
</header>

<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="ov"></canvas>
  <div id="msg">Abrindo câmera…</div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* Monitor + CONTROLES da câmera. Tudo que for definido aqui (buraco,
   sensibilidade) é salvo no mesmo lugar que o telão usa (localStorage)
   e sincroniza AO VIVO com a aba do telão — mesmo navegador/máquina.
   A detecção oficial (que para o cronômetro) roda na aba do telão. */
const $=s=>document.querySelector(s);
const K_CFG="golf_cfg";
function cfg(){ try{return JSON.parse(localStorage.getItem(K_CFG))||{}}catch(e){return {}} }
function patchCfg(p){ const c=cfg(); Object.assign(c,p); localStorage.setItem(K_CFG,JSON.stringify(c)); }
let toastT;
function toast(m,t=""){ const el=$("#toast"); el.textContent=m; el.className="toast show "+t; clearTimeout(toastT); toastT=setTimeout(()=>el.className="toast",2400); }

const camV=$("#cam"), ov=$("#ov");
const N=48;
const octx=(()=>{ const c=document.createElement("canvas"); c.width=N; c.height=N; return c.getContext("2d",{willReadFrequently:true}); })();
let ref=null, lastT=0, stream=null, curDeviceId=null, selecting=false, drag=null;

function sensThreshold(){ const v=Number($("#sensRange").value)||5; return 0.55 - v*0.05; }
$("#sensRange").value=cfg().camSlider||5;
$("#sensRange").addEventListener("input",()=>{ patchCfg({camSlider:Number($("#sensRange").value)}); ref=null; });

async function startCam(){
  const c=cfg();
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    // mesmas restrições do telão para não conflitar com a outra aba
    const vc={ width:{ideal:640}, height:{ideal:480} };
    if(c.camDeviceId) vc.deviceId={exact:c.camDeviceId};
    else vc.facingMode={ideal:"environment"};
    stream=await navigator.mediaDevices.getUserMedia({video:vc,audio:false});
    curDeviceId=c.camDeviceId||null;
    camV.srcObject=stream;
    $("#msg").style.display="none";
    camV.addEventListener("loadedmetadata",()=>{ ov.width=camV.videoWidth; ov.height=camV.videoHeight; },{once:true});
  }catch(e){
    $("#msg").style.display="flex";
    $("#msg").textContent="Não foi possível abrir a câmera. Confira a permissão do navegador.";
  }
}

/* ---- seleção do buraco ---- */
$("#roiBtn").onclick=()=>{
  selecting=!selecting;
  ov.classList.toggle("selecting",selecting);
  $("#roiBtn").classList.toggle("on",selecting);
  toast(selecting?"Arraste um círculo sobre o buraco":"Seleção cancelada");
};
function evNorm(e){
  const r=ov.getBoundingClientRect();
  // vídeo em object-fit:contain — mapeia considerando as faixas pretas
  const va=camV.videoWidth/camV.videoHeight, ba=r.width/r.height;
  let x0=r.left, y0=r.top, w=r.width, h=r.height;
  if(ba>va){ w=r.height*va; x0=r.left+(r.width-w)/2; }
  else{ h=r.width/va; y0=r.top+(r.height-h)/2; }
  return { x:Math.min(1,Math.max(0,(e.clientX-x0)/w)),
           y:Math.min(1,Math.max(0,(e.clientY-y0)/h)) };
}
ov.addEventListener("pointerdown",e=>{ if(!selecting) return; ov.setPointerCapture(e.pointerId); drag={a:evNorm(e), b:evNorm(e)}; });
ov.addEventListener("pointermove",e=>{ if(drag) drag.b=evNorm(e); });
ov.addEventListener("pointerup",()=>{
  if(!drag) return;
  const a=drag.a, b=drag.b;
  drag=null; selecting=false;
  ov.classList.remove("selecting"); $("#roiBtn").classList.remove("on");
  const x=Math.min(a.x,b.x), y=Math.min(a.y,b.y);
  const w=Math.abs(a.x-b.x), h=Math.abs(a.y-b.y);
  if(w<0.02||h<0.02){ toast("Círculo muito pequeno — tente de novo","err"); return; }
  patchCfg({camRoi:{x:x,y:y,w:w,h:h}});
  ref=null;
  toast("Buraco definido ✔ — sincronizado com o telão","ok");
});
$("#roiClear").onclick=()=>{
  patchCfg({camRoi:null});
  ref=null;
  toast("Buraco removido — sincronizado com o telão","ok");
};

/* ---- detecção (visual) ---- */
function roiPixels(r){
  if(!r||!camV.videoWidth) return null;
  try{
    octx.drawImage(camV, r.x*camV.videoWidth, r.y*camV.videoHeight, r.w*camV.videoWidth, r.h*camV.videoHeight, 0,0,N,N);
    return octx.getImageData(0,0,N,N).data;
  }catch(e){ return null; }
}
function diffFrac(cur,ref){
  // área CIRCULAR + análise de claridade: a bolinha de golf é CLARA,
  // então medimos quanto da mudança veio de pixels claros (bolinha)
  // versus escuros (pé, sombra, perna) — {f: sinal, ball: fração clara}
  const NN=Math.sqrt(cur.length/4);
  let n=0, tot=0, bright=0;
  for(let i=0;i<cur.length;i+=4){
    const p=i/4, px=(p%NN)+0.5, py=Math.floor(p/NN)+0.5;
    const dx=px/NN-0.5, dy=py/NN-0.5;
    if(dx*dx+dy*dy>0.25) continue;
    tot++;
    const d=Math.abs(cur[i]-ref[i])+Math.abs(cur[i+1]-ref[i+1])+Math.abs(cur[i+2]-ref[i+2]);
    if(d>95){
      n++;
      const lum=cur[i]*0.299+cur[i+1]*0.587+cur[i+2]*0.114;
      if(lum>140) bright++;
    }
  }
  return { f: tot?n/tot:0, ball: n?bright/n:1 };
}

function loop(t){
  requestAnimationFrame(loop);
  if(t-lastT<66) return;
  lastT=t;
  const c=cfg();
  if((c.camDeviceId||null)!==curDeviceId && stream) startCam();
  if(ov.width!==camV.videoWidth && camV.videoWidth){ ov.width=camV.videoWidth; ov.height=camV.videoHeight; }
  const ctx=ov.getContext("2d");
  ctx.clearRect(0,0,ov.width,ov.height);

  if(drag){
    const a=drag.a, b=drag.b;
    const dX=Math.min(a.x,b.x)*ov.width, dY=Math.min(a.y,b.y)*ov.height;
    const dW=Math.abs(a.x-b.x)*ov.width, dH=Math.abs(a.y-b.y)*ov.height;
    ctx.strokeStyle="#26c281"; ctx.lineWidth=4; ctx.setLineDash([10,7]);
    ctx.beginPath(); ctx.ellipse(dX+dW/2, dY+dH/2, dW/2, dH/2, 0, 0, Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
  }

  const r=c.camRoi;
  $("#roiClear").style.display = r ? "inline-block" : "none";
  if(!r){
    $("#detSt").textContent="defina o buraco"; $("#detSt").className="st";
    $("#meter").style.width="0%";
    return;
  }
  let hot=false, f=0;
  const cur=roiPixels(r);
  if(cur){
    if(!ref) ref=new Uint8ClampedArray(cur);
    const an=diffFrac(cur,ref);
    f=an.f;
    const th=sensThreshold();
    const ballOK=(cfg().ballFilter===false)||an.ball>=0.45;
    hot=f>=th && ballOK;
    var ignored=f>=th && !ballOK;
    if(f<th*0.35){ for(let i=0;i<cur.length;i++){ ref[i]=ref[i]*0.95+cur[i]*0.05; } }
    $("#meter").style.width=Math.min(100, f/(th*2)*100)+"%";
    $("#detSt").textContent=hot?"⛳ OBJETO NO BURACO":(ignored?"movimento ignorado (não é bolinha)":"monitorando");
    $("#detSt").className="st "+(hot?"hot":(ignored?"":"ok"));
  }
  const X=r.x*ov.width, Y=r.y*ov.height, W=r.w*ov.width, H=r.h*ov.height;
  ctx.beginPath(); ctx.ellipse(X+W/2, Y+H/2, W/2, H/2, 0, 0, Math.PI*2);
  ctx.fillStyle=hot?"rgba(247,201,72,.28)":"rgba(38,194,129,.12)"; ctx.fill();
  ctx.strokeStyle=hot?"#f7c948":"#26c281"; ctx.lineWidth=5; ctx.stroke();
  ctx.fillStyle=hot?"#f7c948":"#26c281";
  ctx.font="bold 22px system-ui";
  ctx.fillText("⛳ BURACO", X+8, Math.max(26,Y-10));
}

$("#refBtn").onclick=()=>{ ref=null; toast("Referência recalibrada","ok"); };
$("#fsBtn").onclick=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); };
window.addEventListener("keydown",e=>{ if(e.key==="f"||e.key==="F") $("#fsBtn").click(); });
window.addEventListener("storage",e=>{
  if(e.key!==K_CFG) return;
  $("#sensRange").value=cfg().camSlider||5;
  ref=null;
});

let wakeLock=null;
async function keepAwake(){
  try{
    if(!wakeLock && "wakeLock" in navigator){
      wakeLock=await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release",()=>{ wakeLock=null; });
    }
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") keepAwake(); });
document.addEventListener("click",keepAwake,{once:true});

startCam();
requestAnimationFrame(loop);
keepAwake();
</script>
</body>
</html>
